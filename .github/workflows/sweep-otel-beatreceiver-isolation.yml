name: "Sweeper: OTel BeatReceiver Global State Isolation"
on:
  schedule:
    - cron: "0 9 * * 4"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-code-quality-audit.lock.yml@v0
    with:
      title-prefix: "[otel-beatreceiver-isolation]"
      severity-threshold: "high"
      additional-instructions: |
        You are auditing the OTel BeatReceiver integration for isolation correctness. Produce
        findings that would impress a senior engineer: a small number of thoroughly investigated
        cases where two receivers running concurrently in the same process produce incorrect
        behavior, a data race, or a panic — with working test code to demonstrate each one.
        One confirmed bug is worth more than a list of global variables that might be shared.

        ## What the receiver guarantees

        Beats can run as OpenTelemetry receivers inside an OTel Collector
        (`x-pack/filebeat/fbreceiver/`, `x-pack/metricbeat/mbreceiver/`). When a Collector
        is configured with multiple beat receivers, or restarts a receiver on config reload,
        those receivers are constructed and may run concurrently in the same process.

        Each receiver must behave as if it is the only one. Its configuration, data paths,
        identity, and runtime state must be fully independent from any other receiver in the
        same process. Two receivers with different configs must not influence each other.

        The shared initialization path under `x-pack/libbeat/cmd/instance/` is the
        highest-risk area. It predates OTel receiver support and was written assuming one
        beat per process. OTel receiver support was added on top of it. Use
        `git log --oneline -- x-pack/libbeat/cmd/instance/ x-pack/filebeat/fbreceiver/ x-pack/metricbeat/mbreceiver/`
        to understand what changed when OTel support was introduced — those commits are the
        most likely source of isolation bugs, because they are where per-process assumptions
        were first challenged.

        ## How to investigate

        Read the full receiver construction path — from the factory's `Create*()` function
        through every initialization call it makes. Build a model of what state is being
        created and where it lives: is it stored on the receiver struct (good), in a
        package-level variable (potentially bad), or in a shared singleton (depends)?

        For each initialization call, ask:

        **Is it isolated?** If two receivers call it with different arguments, does each get
        its own independent result, or does one receiver's argument overwrite state the other
        receiver established?

        **Is it idempotent?** If two receivers call it with the same arguments — or if one
        receiver calls it twice due to a restart — does the second call panic, silently
        no-op, or produce a different result than the first?

        **Is it safe to call concurrently?** If both receivers initialize at the same time,
        can they race on a shared variable?

        Focus especially on: path and working-directory resolution (each receiver's paths
        should be relative to its own config, not a shared global), plugin and processor
        registration (safe if it happens once at process startup, unsafe if it happens once
        per receiver construction), and any place where a receiver stores configuration or
        identity into a package-level variable that the next receiver then reads.

        These questions are starting points. If you understand the construction path well
        enough to see an isolation failure not described here, file it.

        ## The reproduction is the argument

        When you think you have found something, write a test that constructs two receivers
        using the factory — look at existing tests in the receiver packages for the
        construction pattern — and asserts they have independent state. Run with `-race`:
        `go test -race ./x-pack/filebeat/fbreceiver/... ./x-pack/metricbeat/mbreceiver/...`

        For double-construction panics, construct a receiver twice sequentially and assert
        the second construction does not panic.

        If `-race` does not fire and the test does not panic, trace why before concluding it
        is safe. A `sync.Once`, a package `init()`, or an idempotent registration function
        may provide real protection — note it. If you find no protection and cannot trigger
        the failure, you do not yet understand the code path well enough to file.

        ## Output

        File a single issue containing:
        - Each confirmed race or incorrect behavior: test code, the specific shared variable
          or call, and the fix direction
        - Each confirmed panic on double-construction: test code and fix direction
        - State you investigated and found safe, with what protects it
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
