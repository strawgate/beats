name: "Sweeper: Libbeat Pipeline Shutdown and Queue Lifecycle"
on:
  schedule:
    - cron: "0 9 * * 3"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-code-quality-audit.lock.yml@v0
    with:
      title-prefix: "[libbeat-pipeline-lifecycle]"
      severity-threshold: "high"
      additional-instructions: |
        You are auditing libbeat's publisher pipeline for correctness under shutdown,
        reconnection, and backpressure. Produce findings that would impress a senior engineer:
        a small number of thoroughly investigated, reproducible failures — panics, hangs, or
        silent event loss that a real deployment would encounter. One confirmed bug with a
        working test is worth more than ten suspicious patterns described from reading alone.

        ## What the pipeline guarantees

        The libbeat publisher pipeline (`libbeat/publisher/pipeline/`, `libbeat/publisher/queue/`)
        connects inputs to outputs and makes three guarantees: events are not silently dropped,
        shutdown completes in bounded time, and no goroutines leak after close. These must hold
        during normal shutdown, output reconnection, and backpressure from a slow or unavailable
        output.

        The pipeline has a defined shutdown order: queue drains, consumer stops, output workers
        stop. Each stage signals the next. A stage that closes a channel or signals completion
        before its upstream has finished sending either panics (send on closed channel) or
        hangs (goroutine blocked on a signal that never comes).

        ## How to investigate

        Read the pipeline shutdown sequence end-to-end before looking for bugs. Understand
        what each component owns, what it waits for before stopping, and what it signals when
        done. Draw the dependency graph in your head: which goroutines wait on which channels,
        and in what order are those channels closed? Only once you have that model should you
        start looking for violations.

        Ask these questions of each channel in the system:

        **Who sends, who receives, and is there exactly one receiver?** A channel used to
        signal multiple goroutines must be closed, not sent to — a send wakes exactly one
        waiter. A buffered send used as a shutdown signal to multiple goroutines leaves all
        but one blocked forever.

        **Can this channel be closed while a sender is still running?** Trace both lifetimes.
        If the owner closes the channel before the sender's goroutine exits, the sender panics.

        **What happens to in-flight events during shutdown?** If a flush is attempted, does
        it have a timeout? If an ACK callback does slow work (I/O, anything blocking), it
        holds up the ACK loop, which holds up the drain, which holds up `WaitClose()`.

        Also look at the queue implementations — memqueue and diskqueue — specifically for
        response channels returned to object pools. A channel recycled while another goroutine
        still holds a reference delivers a stale message to the next borrower, corrupting
        the ACK sequence.

        Use `git log --oneline -p -- libbeat/publisher/` to find recent changes to shutdown
        ordering or queue lifecycle. Shutdown sequences are subtle enough that well-intentioned
        refactors often introduce new orderings that violate the invariant.

        These patterns are starting points. If you understand the pipeline well enough to see
        a failure mode not described here, file it.

        ## The reproduction is the argument

        When you think you have found something, write a test before filing. For shutdown
        races, call `Close()` while events are in flight and assert it returns within a short
        timeout. For hangs, fail the test with a timeout goroutine. For panics, use
        `require.NotPanics`. Run with `-race`:
        `go test -race ./libbeat/publisher/...`

        If you cannot write a failing test, keep tracing. A race that reads as plausible but
        cannot be triggered is either protected by something you have not found, or is
        unreachable from the real code path.

        ## Output

        File a single issue containing:
        - Each confirmed bug: test code, the specific goroutine interaction or channel
          ordering that fails, and the fix direction
        - Which bugs are detectable only under `-race` vs reproducible deterministically
        - Components you audited and found safe, with what protects them
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
