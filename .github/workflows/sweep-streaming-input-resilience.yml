name: "Sweeper: Streaming Input Error Path Resilience"
on:
  schedule:
    - cron: "0 9 * * 5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-code-quality-audit.lock.yml@v0
    with:
      title-prefix: "[streaming-input-resilience]"
      severity-threshold: "high"
      additional-instructions: |
        You are auditing Filebeat's streaming inputs for resilience against real server and
        network failures. Produce findings that would impress a senior engineer: a small
        number of thoroughly investigated, reproducible failures where a real deployment
        would lose data, spin at 100% CPU, or stop collecting events because a remote server
        misbehaved in an ordinary way. One confirmed bug with a working test is worth more
        than a list of error paths that look suspicious.

        ## What these inputs guarantee

        The streaming inputs (`x-pack/filebeat/input/streaming/`, `x-pack/filebeat/input/httpjson/`,
        `x-pack/filebeat/input/cel/`) maintain long-lived or repeating connections to external
        services. They make three guarantees: no event is lost due to a transient error (the
        input reconnects and resumes from the last confirmed cursor), no server error response
        is published as a real event, and no failure causes the input to spin or hang.

        The cursor is the heart of the delivery guarantee. It must advance only after an event
        is confirmed by the pipeline, and it must be preserved intact across reconnects. An
        input that advances the cursor before the ACK loses events on crash. An input that
        returns a mutated or nil cursor from an error path will behave incorrectly on the next
        connection — and the failure may be invisible until a user notices a gap in their data.

        ## How to investigate

        Pick one or two inputs and read the main run loop thoroughly. Understand the normal
        flow first: connection established, event received, cursor advanced, loop continues.
        Map what state is maintained across iterations. Then introduce failure at each point
        and trace what happens.

        Specific failure modes worth pursuing:

        **Cursor state after a dropped connection.** If the connection closes mid-stream, what
        is the exact cursor value returned from the failing function? Does the caller use it
        as the starting point for the next connection? If the error path returns a partially
        advanced cursor, the next connection starts from the wrong place.

        **Server error responses published as events.** If an HTTP endpoint returns a 4xx or
        5xx response, or a WebSocket endpoint sends an error frame, does the input validate
        the response before passing it to the event decoder? A 500 response with body
        `"Internal Server Error"` fed to a JSON decoder produces a malformed event in the
        output.

        **Tight retry loops from duration arithmetic.** If a retry interval or backoff duration
        is computed from a server-provided value — a `Retry-After` header, a token expiry
        time, a poll interval from the API response — what happens when that value is zero,
        negative, or in the past? A `time.After(0)` or `time.NewTicker(0)` fires immediately
        and continuously. Trace every duration computation to confirm it is validated to be
        positive before use.

        **Permanent failure from a single transient error.** Any `return err` from inside a
        retry loop that does not give the input a chance to recover is a latent bug. Token
        fetch failures, single HTTP errors, and similar transient conditions should trigger
        a retry with backoff, not a permanent stop.

        Use `git log --oneline -p -- x-pack/filebeat/input/streaming/ x-pack/filebeat/input/httpjson/ x-pack/filebeat/input/cel/`
        to find recently added error paths or recently changed retry logic. New input backends
        and new authentication methods are added frequently — freshly written error paths are
        where these bugs concentrate.

        These patterns are starting points. If you understand an input's run loop well enough
        to see a failure mode not described here, file it.

        ## The reproduction is the argument

        When you think you have found something, write a test using the existing mock server
        infrastructure in the input's `*_test.go` files. Configure the mock to return the
        error response that triggers the failure and assert the input's behavior: cursor is
        unchanged after the error, no events are published for the error response, no
        goroutines leak after the input stops, and the input makes no more than N retries in
        a bounded time window for tight-loop bugs.

        `go test ./x-pack/filebeat/input/streaming/... ./x-pack/filebeat/input/httpjson/... ./x-pack/filebeat/input/cel/...`

        If you cannot write a mock server that produces the failure, trace whether it can
        arise with a real server behaving in a documented or commonly observed way. If not,
        it may not be worth filing.

        ## Output

        File a single issue containing:
        - Each confirmed bug: test code, the exact server behavior that triggers it, and the
          fix direction
        - Error paths you investigated and found safe, with what protects them
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
