name: "Sweeper: Filestream Registry and State Machine"
on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  run:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-code-quality-audit.lock.yml@v0
    with:
      title-prefix: "[filestream-registry]"
      severity-threshold: "high"
      additional-instructions: |
        You are auditing Filestream's registry and state machine for correctness. Produce
        findings that would impress a senior engineer: a small number of thoroughly
        investigated, reproducible scenarios where real user data would be silently duplicated
        or lost. One confirmed bug with a working test is worth more than ten suspicious
        patterns described from reading alone.

        ## What the registry guarantees

        The Filestream input (`filebeat/input/filestream/`) makes one core promise: every log
        line is delivered exactly once. The registry
        (`filebeat/input/filestream/internal/input-logfile/`) enforces this by persisting each
        file's read offset to disk. If the registry loses an offset, the file re-reads from
        the beginning — producing duplicates that a user may not notice for days. If a cursor
        update is discarded after an event is published but before it is persisted, events
        are re-sent on the next restart with no indication anything went wrong.

        ## How to investigate

        Read the full lifecycle of a single file: discovery → harvesting → publish → ACK →
        cursor persisted to disk. Understand every state transition and every component that
        touches a file's state. Form a clear model of the happy path first. Then look for
        where real conditions break it.

        Three areas worth pursuing deeply:

        **Silent cursor discard.** Trace the path from "output ACKs an event" back to "registry
        entry updated on disk." At each step — version checks, resource lifecycle checks,
        concurrent cleanup — is there a condition where the ACK is processed but the cursor
        is not advanced? If a resource is superseded between publish time and ACK time, does
        the ACK get attributed to the right version, or is it silently dropped?

        **Wrong identity match.** Both inode-based and fingerprint-based identity modes have
        edge cases under log rotation and config changes. What happens when a new file takes
        the same inode as a recently rotated one? What happens when identity mode is changed
        between restarts? Can a file ever end up matched to a stale entry — inheriting a
        wrong offset — or lose its entry entirely and restart from zero?

        **Cleanup racing an active harvester.** The `clean_inactive` and `clean_removed`
        settings delete registry entries after some time. What is the exact condition that
        makes an entry eligible for deletion? Is there a window where an entry is deleted
        while events from that file are still in-flight in the pipeline — so the ACK fires
        after cleanup, writes to a stale or re-created entry, and the update is lost?

        Use `git log --oneline -p -- filebeat/input/filestream/` to understand recent changes.
        Migration path code, identity mode additions, and cleanup timing changes are the most
        regression-prone areas — a recently changed transition is always worth more scrutiny
        than one that has been stable for years.

        These three areas are starting points, not a ceiling. If you understand the state
        machine well enough to see a failure mode not described here, that is exactly the
        kind of finding we want.

        ## The reproduction is the argument

        When you think you have found something, write a test before filing. Use the existing
        test infrastructure in the package — look at `*_test.go` files for registry and
        harvester helper patterns. Set up the state that precedes the bug, trigger the
        transition, and assert the cursor is preserved correctly afterward.
        `go test ./filebeat/input/filestream/...`

        If you cannot write a failing test, keep tracing. A scenario that seems problematic
        from reading but cannot be demonstrated either has a protection you have not found,
        or is not reachable from the real code path.

        ## Output

        File a single issue containing:
        - Each confirmed bug: test code or precise reproduction steps, the exact state
          transition that fails, and the fix direction
        - Scenarios you investigated thoroughly and found safe, with what protects them —
          this establishes the coverage and makes the filed bugs more credible
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
