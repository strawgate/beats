# geodata_corruption_conditional.yml
#
# Demonstrates a cache corruption bug in add_host_metadata's geoData handling.
# Only the FIRST event's geo is modified, but ALL subsequent events see the
# corrupted value because they share the same cached map reference.
#
# Setup:
#   echo 'MUTATE_GEO' > /tmp/geo-bug-input.log
#   echo 'normal event' >> /tmp/geo-bug-input.log
#   echo 'another normal event' >> /tmp/geo-bug-input.log
#
# Run:
#   ./filebeat -e -c geodata_corruption_conditional.yml 2>/dev/null \
#     | jq '{message, geo_name: .host.geo.name}'
#
# Expected:
#   {"message": "MUTATE_GEO",           "geo_name": "FIRST-EVENT-ONLY"}
#   {"message": "normal event",         "geo_name": "datacenter-east"}
#   {"message": "another normal event", "geo_name": "datacenter-east"}
#
# Actual (before fix):
#   {"message": "MUTATE_GEO",           "geo_name": "FIRST-EVENT-ONLY"}
#   {"message": "normal event",         "geo_name": "FIRST-EVENT-ONLY"}  <-- CORRUPTED
#   {"message": "another normal event", "geo_name": "FIRST-EVENT-ONLY"}  <-- CORRUPTED
#
# Root cause: add_host_metadata passes p.geoData to DeepUpdate without
# cloning. DeepUpdate aliases the inner "geo" map reference into
# event.Fields. The add_fields below uses target="" to merge at root,
# overwriting the nested host.geo.name on only the first event. Because
# the event's geo map IS the cached map, the write corrupts all future events.

filebeat.inputs:
  - type: filestream
    id: geo-bug-test
    paths:
      - /tmp/geo-bug-input.log

processors:
  - add_host_metadata:
      geo:
        name: "datacenter-east"
        location: "40.7128, -74.0060"
        continent_name: "North America"
        country_name: "United States"
        country_iso_code: "US"
        region_name: "New York"
        region_iso_code: "US-NY"
        city_name: "New York"

  # target: "" merges at root, so host.geo.name is overwritten via DeepUpdate.
  # This only runs when the message contains "MUTATE_GEO" (first event).
  - add_fields:
      target: ""
      fields:
        host.geo.name: "FIRST-EVENT-ONLY"
      when:
        contains:
          message: "MUTATE_GEO"

output.console:
  pretty: false
