# geodata_corruption_repro.yml
#
# Simpler reproduction: every event has host.geo.name overwritten via
# add_fields with target="" (merging at root). With the geoData cache
# corruption bug, the overwrite permanently mutates the cached geoData
# map, so even removing this processor would not restore the original
# value within the same process lifetime.
#
# Setup:
#   echo 'hello world' > /tmp/geo-bug-input.log
#   echo 'second line' >> /tmp/geo-bug-input.log
#   echo 'third line' >> /tmp/geo-bug-input.log
#
# Run:
#   ./filebeat -e -c geodata_corruption_repro.yml 2>/dev/null \
#     | jq '{message, geo_name: .host.geo.name}'
#
# All events show geo_name="OVERWRITTEN" (both with and without the fix,
# since add_fields runs unconditionally). The bug is that without the fix,
# the CACHED p.geoData map is permanently mutated. See the conditional
# variant (geodata_corruption_conditional.yml) for a demo where the
# corruption is visible in the output.

filebeat.inputs:
  - type: filestream
    id: geo-bug-test
    paths:
      - /tmp/geo-bug-input.log

processors:
  - add_host_metadata:
      geo:
        name: "datacenter-east"
        location: "40.7128, -74.0060"
        continent_name: "North America"
        country_name: "United States"
        country_iso_code: "US"
        region_name: "New York"
        region_iso_code: "US-NY"
        city_name: "New York"

  # target: "" merges at root level, overwriting nested host.geo.name.
  - add_fields:
      target: ""
      fields:
        host.geo.name: "OVERWRITTEN"

output.console:
  pretty: false
