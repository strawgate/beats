# geodata_corruption_repro.yml
#
# Simpler reproduction: every event has geo.name overwritten. Without the
# bug, this is just normal processor behavior. With the bug, it also
# permanently corrupts the cached geoData — but since every event
# overwrites anyway, the corruption is masked. See the conditional
# variant (geodata_corruption_conditional.yml) for a more dramatic demo.
#
# Setup:
#   echo 'hello world' > /tmp/geo-bug-input.log
#   echo 'second line' >> /tmp/geo-bug-input.log
#   echo 'third line' >> /tmp/geo-bug-input.log
#
# Run (revert our fix first to reproduce):
#   ./filebeat -e -c geodata_corruption_repro.yml 2>/dev/null \
#     | jq '{message, geo_name: .host.geo.name}'
#
# All events will show geo_name="OVERWRITTEN" (both with and without
# the bug fix, since add_fields runs unconditionally). The difference
# is that WITHOUT the fix, the cached p.geoData map is permanently
# modified — if you removed the add_fields processor and restarted,
# the original "datacenter-east" value would still be gone within
# the same process lifetime.

filebeat.inputs:
  - type: filestream
    id: geo-bug-test
    paths:
      - /tmp/geo-bug-input.log

processors:
  - add_host_metadata:
      geo:
        name: "datacenter-east"
        location: "40.7128, -74.0060"
        continent_name: "North America"
        country_name: "United States"
        country_iso_code: "US"
        region_name: "New York"
        region_iso_code: "US-NY"
        city_name: "New York"

  - add_fields:
      target: "host.geo"
      fields:
        name: "OVERWRITTEN"

output.console:
  pretty: false
